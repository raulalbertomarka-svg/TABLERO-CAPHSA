<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAHPSA · Tablero de Campo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --vd:#c0182a;--vm:#d9253a;--vc:#e63946;
  --vs:#fdecea;--vb:#f4b8bc;
  --bg:#fdf7f7;--bg2:#ffffff;--bg3:#fdf0f0;--bg4:#fbe4e4;
  --brd:rgba(192,24,42,0.10);--brd2:rgba(192,24,42,0.20);
  --tx:#1e0a0b;--tx2:#6b2d32;--tx3:#a07070;
  --am:#d4850a;--am-bg:#fff8ec;--am-br:#f0c070;
  --rd:#c0392b;--rd-bg:#fdf0ee;--rd-br:#e8a099;
  --tl:#1a7a5e;--tl-bg:#e8f7f2;--tl-br:#90d4be;
  --or:#b85c00;--or-bg:#fff3e0;--or-br:#ffb74d;
  --pu:#6d28d9;--pu-bg:#f3e8ff;--pu-br:#c4b5fd;
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
[data-theme="dark"]{
  --bg:#0e1117;--bg2:#151b24;--bg3:#1c2333;--bg4:#232d40;
  --brd:rgba(255,255,255,.06);--brd2:rgba(255,255,255,.11);
  --tx:#e8edf5;--tx2:#8a95aa;--tx3:#49546a;
  --vd:#e63946;--vm:#f04050;--vc:#f75c68;
  --vs:#1e1114;--vb:#3d1a1f;
  --am:#f0a030;--am-bg:#1e1500;--am-br:#5a3a00;
  --rd:#e63946;--rd-bg:#1a0d10;--rd-br:#5a1f25;
  --tl:#2ec4b6;--tl-bg:#081a18;--tl-br:#0f4a44;
  --or:#f07830;--or-bg:#1e1000;--or-br:#5a2a00;
  --pu:#a78bfa;--pu-bg:#14102a;--pu-br:#3d2a70;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:14px;min-height:100vh;transition:background .35s,color .25s;}

.topbar{background:var(--bg2);border-bottom:1.5px solid var(--vb);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.brand{display:flex;align-items:center;gap:12px;}
.bname{font-size:15px;font-weight:600;color:var(--vd);}
.bsub{font-size:10px;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase;}
.bdiv{width:1px;height:28px;background:var(--brd2);margin:0 6px;}
.bmod{font-size:12px;color:var(--tx2);}

.statusbar{padding:7px 24px;background:var(--bg3);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:8px;font-size:11px;color:var(--tx2);}
.sdot{width:7px;height:7px;border-radius:50%;}
.sdot.ok{background:var(--vc);box-shadow:0 0 5px var(--vc);}
.sdot.err{background:var(--rd);}
.sdot.loading{background:var(--am);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.controls{padding:12px 24px;background:var(--bg2);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.ctrl-btn{background:var(--bg3);border:1px solid var(--brd2);color:var(--tx2);padding:5px 13px;border-radius:7px;cursor:pointer;font-size:12px;}
.ctrl-btn.export{background:var(--vd);color:#fff;border:none;}

.tabs{background:var(--bg2);border-bottom:1.5px solid var(--brd);padding:0 24px;display:flex;overflow-x:auto;}
.tab{padding:13px 18px;font-size:13px;font-weight:500;cursor:pointer;color:var(--tx2);border-bottom:2.5px solid transparent;white-space:nowrap;}
.tab.active{color:var(--vd);border-bottom-color:var(--vc);}

.main{padding:20px 24px;}
.panel{display:none;}
.panel.active{display:block;}

.sum-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px;}
.kpi{background:var(--bg2);border:1px solid var(--brd);border-radius:10px;padding:14px 16px;border-top:3px solid;}
.kpi-val{font-size:24px;font-weight:600;font-family:var(--mono);}

.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}
.chart-card{background:var(--bg2);border:1px solid var(--brd);border-radius:10px;padding:18px;}

.twrap{background:var(--bg2);border:1px solid var(--brd);border-radius:10px;overflow:auto;}
table{width:100%;border-collapse:collapse;}
thead th{text-align:left;padding:9px 14px;font-size:11px;background:var(--bg3);border-bottom:1px solid var(--brd);color:var(--tx3);}
tbody td{padding:9px 14px;border-bottom:1px solid var(--brd);font-size:13px;}

#loader{position:fixed;inset:0;z-index:9999;background:#1a0305;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s;}
#loader.ocultar{opacity:0;pointer-events:none;}
.loader-barra-wrap{width:200px;height:3px;background:rgba(255,255,255,0.1);}
.loader-barra{height:100%;width:0%;background:#e63946;transition:width 0.3s;}

.pill{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.pill.vencido{background:var(--rd-bg);color:var(--rd);}
.pill.ok{background:var(--tl-bg);color:var(--tl);}
</style>
</head>
<body data-theme="light">

<div id="loader">
  <div style="color:#fff;font-size:24px;font-weight:800;letter-spacing:2px;">CAHPSA</div>
  <div class="loader-barra-wrap"><div class="loader-barra" id="loader-barra"></div></div>
  <div style="color:rgba(255,255,255,0.5);font-size:10px;">Sincronizando con Google Sheets...</div>
</div>

<div class="topbar">
  <div class="brand">
    <div class="bname">CAHPSA</div>
    <div class="bdiv"></div>
    <div class="bmod">Tablero de Campo</div>
  </div>
  <div class="topbar-right">
    <button class="ctrl-btn" onclick="toggleTheme()" id="theme-icon">🌙</button>
    <button class="ctrl-btn" onclick="loadAll(true)">↻ Actualizar</button>
  </div>
</div>

<div class="statusbar">
  <div class="sdot loading" id="sdot"></div>
  <span id="stxt">Conectando...</span>
  <span id="stime" style="margin-left:auto;"></span>
</div>

<div class="controls">
  <input type="date" class="ctrl-btn" id="fecha-desde">
  <input type="date" class="ctrl-btn" id="fecha-hasta">
  <button class="ctrl-btn" onclick="todoPeriodo()">Todo el período</button>
  <button class="ctrl-btn export" onclick="exportarExcel()">Exportar Excel</button>
  <div style="margin-left:auto;font-weight:600;">Total: <span id="total-num">0</span></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('resumen',this)">📊 Resumen</div>
  <div class="tab" onclick="switchTab('proximos',this)">⏰ Próximos</div>
  <div class="tab" onclick="switchTab('vencidos',this)">🔴 Vencidos</div>
</div>

<div class="main">
  <div class="panel active" id="panel-resumen">
    <div class="sum-kpis">
      <div class="kpi" style="border-top-color:var(--rd);"><div style="font-size:11px;">Vencidos</div><div class="kpi-val" id="k-vencidos">0</div></div>
      <div class="kpi" style="border-top-color:var(--or);"><div style="font-size:11px;">Próximos</div><div class="kpi-val" id="k-prox">0</div></div>
      <div class="kpi" style="border-top-color:var(--tl);"><div style="font-size:11px;">Averiados</div><div class="kpi-val" id="k-aver">0</div></div>
    </div>
    <div class="charts-grid">
      <div class="chart-card">
        <div style="font-weight:600;margin-bottom:15px;">📍 Top PDV con Vencimientos</div>
        <div id="bar-pdv"></div>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-proximos">
    <div class="twrap">
      <table id="tbl-p">
        <thead><tr><th>Fecha</th><th>Relevador</th><th>PDV</th><th>Producto</th><th>Vencimiento</th><th>Días</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="panel" id="panel-vencidos">
    <div class="twrap">
      <table id="tbl-v">
        <thead><tr><th>Fecha</th><th>Relevador</th><th>PDV</th><th>Producto</th><th>Vencimiento</th><th>Días</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ID DE PUBLICACIÓN WEB (El que empieza con 2PACX)
const PUB_ID = '2PACX-1vRgn8YMYujWrR1f6bZTL1ku6jSxaaCe_l3gmMnQlWcplHs_XRoxq-YnRFMNjgktNeZEcyA_X9ouFIy5';

let RAW_VENCER=[], RAW_RELEV_PDV=[], RAW_RELEV=[];

// Función ajustada para Publication Web
function csvUrl(id, sheetName) {
  return `https://docs.google.com/spreadsheets/d/e/${id}/pub?output=csv&sheet=${encodeURIComponent(sheetName)}`;
}

function parseCSV(text) {
  return text.trim().split('\n').map(line => {
    const cols = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
      else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    cols.push(cur.trim()); return cols;
  });
}

function diasRest(dateStr) {
  if(!dateStr) return null;
  const parts = dateStr.split('/');
  if(parts.length < 3) return null;
  const f = new Date(parts[2], parts[1]-1, parts[0]);
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  return Math.round((f - hoy) / 86400000);
}

async function loadAll(manual) {
  if(manual) showLoader();
  setStatus('loading', 'Sincronizando...');
  
  try {
    // Intentamos cargar la Hoja 1
    const res1 = await fetch(csvUrl(PUB_ID, 'Hoja 1'));
    if(!res1.ok) throw new Error("No se pudo acceder a Hoja 1");
    const text1 = await res1.text();
    RAW_VENCER = parseCSV(text1).slice(1);

    // Intentamos cargar Hoja 2 y 3 (opcionales para que no rompan el tablero)
    try {
        const res2 = await fetch(csvUrl(PUB_ID, 'Hoja 2'));
        if(res2.ok) RAW_RELEV_PDV = parseCSV(await res2.text()).slice(1);
    } catch(e) { console.warn("Hoja 2 no disponible"); }

    renderAll();
    setStatus('ok', 'Conectado');
    updateTime();
  } catch (e) {
    console.error(e);
    setStatus('err', 'Error de conexión. Verifica permisos.');
  }
  hideLoader();
}

function renderAll() {
  const tbP = document.querySelector('#tbl-p tbody');
  const tbV = document.querySelector('#tbl-v tbody');
  tbP.innerHTML = ''; tbV.innerHTML = '';

  let cProx = 0, cVenc = 0;

  RAW_VENCER.forEach(r => {
    const d = diasRest(r[9] || r[5]); // Ajustar índice según tu sheet
    const rowHtml = `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[8] || r[4]}</td><td>${r[9] || r[5]}</td><td>${d}</td></tr>`;
    
    if(d !== null && d < 0) {
      tbV.innerHTML += rowHtml; cVenc++;
    } else if (d !== null && d <= 30) {
      tbP.innerHTML += rowHtml; cProx++;
    }
  });

  document.getElementById('k-vencidos').textContent = cVenc;
  document.getElementById('k-prox').textContent = cProx;
  document.getElementById('total-num').textContent = RAW_VENCER.length;
}

function setStatus(s, m) { 
    const d = document.getElementById('sdot');
    d.className = 'sdot ' + s;
    document.getElementById('stxt').textContent = m;
}

function updateTime() {
    const n = new Date();
    document.getElementById('stime').textContent = n.toLocaleTimeString();
}

function showLoader() { document.getElementById('loader').classList.remove('ocultar'); document.getElementById('loader-barra').style.width = '40%'; }
function hideLoader() { document.getElementById('loader-barra').style.width = '100%'; setTimeout(() => document.getElementById('loader').classList.add('ocultar'), 500); }

function switchTab(n, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active'); document.getElementById('panel-' + n).classList.add('active');
}

function toggleTheme() {
    const b = document.body;
    b.dataset.theme = b.dataset.theme === 'dark' ? 'light' : 'dark';
}

function todoPeriodo() { loadAll(true); }
function exportarExcel() { alert("Generando archivo..."); }

// Iniciar
loadAll();
</script>
</body>
</html>
